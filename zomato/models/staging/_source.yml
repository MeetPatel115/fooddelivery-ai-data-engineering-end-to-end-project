sources:
  - name: raw
    database: ZOMATO
    schema: RAW
    tables:
      - name: restaurants
        description: "This table contains information about restaurants, including their names, locations, cuisines, and ratings. It serves as a foundational dataset for analyzing restaurant trends and customer preferences."
      - name: users
        description: "This table contains information about users, including their names, locations, and other demographic details. It is essential for understanding user behavior and preferences in the context of restaurant reviews and ratings."
      - name: food
        description: "This table contains information about food items, including their names, types, and associated restaurant IDs. It is crucial for analyzing food trends, customer preferences, and the relationship between restaurants and their menu offerings."
      - name: reviews
        description: "This table contains information about reviews, including user IDs, restaurant IDs, ratings, and review texts. It is vital for understanding customer feedback, sentiment analysis, and the overall dining experience."
      - name: orders
        description: "This table contains information about orders, including order IDs, user IDs, restaurant IDs, food item IDs, and timestamps. It is essential for analyzing ordering patterns, customer preferences, and the performance of restaurants in fulfilling orders."
      - name: order_items
        description: "This table contains information about individual items within orders, including order item IDs, order IDs, food item IDs, quantities, and prices. It is crucial for understanding the composition of orders, customer preferences for specific food items, and the revenue generated by each item."
      - name: menu
        description: "This table contains information about menu items, including their names, descriptions, prices, and associated restaurant IDs. It is essential for analyzing menu offerings, pricing strategies, and customer preferences for different food items."
